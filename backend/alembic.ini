; Alembic config. Most knobs left at default — only the script location and
; logging are non-default. The database URL is intentionally left blank here
; and set programmatically in migrations/env.py from pydantic Settings, so
; there is one source of truth for env-loading (no duplicate code, no risk
; of the two paths drifting).

[alembic]
script_location = migrations
prepend_sys_path = .
# Migration filenames carry the date so `ls` orders them like history.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]
# Optional: format new revisions with ruff. Only runs if ruff is installed.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
