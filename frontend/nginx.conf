server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app — every unknown path falls through to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed asset bundles; HTML is always re-validated.
  location ~* \.(js|css|svg|woff2?|png|jpg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
